<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4f0e7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#11161c" media="(prefers-color-scheme: dark)">
  <meta name="robots" content="noindex,nofollow">
  <title>Project Hail Mary — Interactive Bilingual Reader</title>
  <link rel="stylesheet" href="assets/styles.css">
</head>
<body>
  <div class="reading-progress" aria-hidden="true"><span id="progress-bar"></span></div>
  <main>
    <header class="site-header" id="top">
      <p class="book-title">Interactive bilingual reader</p>
      <h1>Project Hail Mary<span>English · 中文</span></h1>
      <p class="hint">Tap any English sentence to see its Chinese translation.</p>
    </header>

    <nav class="contents" id="contents" aria-labelledby="contents-title">
      <h2 id="contents-title">Contents</h2>
      <ol id="contents-list" aria-live="polite"></ol>
    </nav>

    <p class="reader-status" id="reader-status" role="status">Loading contents…</p>
    <div id="chapter-mount"></div>
    <noscript><p class="reader-error">JavaScript is required to load the chapter text.</p></noscript>
  </main>

  <a class="contents-fab" href="./#contents" aria-label="Back to contents">目录</a>

  <dialog id="translation-dialog" aria-labelledby="dialog-label">
    <div class="translation-panel">
      <button class="close-dialog" type="button" aria-label="Close translation">×</button>
      <p class="dialog-label" id="dialog-label">中文翻译</p>
      <p class="translation" id="translation-text" lang="zh-CN"></p>
      <p class="source-sentence" id="source-text" lang="en"></p>
    </div>
  </dialog>

  <script src="assets/reader.js" defer></script>
</body>
</html>
